name: 'CI Admission Queue'
description: >-
  Cap how many open PRs run heavy CI at once. Label-gated admission queue: admit, hold, bypass, exclude. FIFO and priority strategies.
author: ''
branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  token:
    description: >-
      Token with pull-requests:write (to manage labels). The default
      GITHUB_TOKEN works within one repo; use a PAT/App token if your heavy
      lanes must re-trigger on the `labeled` event (GITHUB_TOKEN-added labels
      do not start new workflow runs).
    required: true
    default: ${{ github.token }}
  config:
    description: 'Path to the queue config file.'
    required: false
    default: '.github/ci-queue.yml'

outputs:
  admitted:
    description: 'JSON array of admitted PR numbers.'
    value: ${{ steps.queue.outputs.admitted }}
  held:
    description: 'JSON array of held (queued) PR numbers.'
    value: ${{ steps.queue.outputs.held }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev
    - id: queue
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_CONFIG: ${{ inputs.config }}
      run: node src/run.js
